name: Native size compiler experiments
on:
  workflow_dispatch:
  push:
    branches: [feature/windows-workspace]
    paths: ['.github/workflows/native-size-experiments.yml', 'tools/macos_strip.py', 'packaging/package.py', 'tools/install-linux-backend-deps.sh']
permissions:
  contents: read
jobs:
  macos-oz:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python tools/fetch-footprint-deps.py
      - run: python tools/fetch-lan-deps.py
      - name: Configure isolated macOS size experiment
        run: >-
          cmake --preset release
          '-DCMAKE_C_FLAGS_MINSIZEREL=-Oz -DNDEBUG'
          '-DCMAKE_CXX_FLAGS_MINSIZEREL=-Oz -DNDEBUG'
          '-DCMAKE_OBJCXX_FLAGS_MINSIZEREL=-Oz -DNDEBUG'
          -DCMAKE_C_VISIBILITY_PRESET=hidden
          -DCMAKE_CXX_VISIBILITY_PRESET=hidden
          -DCMAKE_OBJCXX_VISIBILITY_PRESET=hidden
          -DCMAKE_VISIBILITY_INLINES_HIDDEN=ON
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Record actual Objective-C++ optimization and IPO flags
        run: |
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path('out/core-Darwin-release')
          commands = json.loads((root / 'compile_commands.json').read_text())
          selected = [row for row in commands if row['file'].endswith(('platform/macos/Menu.mm', 'platform/MenuHost.cpp', 'platform/macos/Application.mm', 'core/src/storage.cpp'))]
          (root / 'size-compile-evidence.json').write_text(json.dumps(selected, indent=2) + '\n')
          for row in selected:
              print('::notice title=Compile flags::' + row['command'].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
      - id: macos-build
        run: cmake --build --preset release
      - run: ctest --preset release --output-on-failure --output-junit ci-tests.xml
      - name: Report all CTest failures
        if: always()
        run: python tools/ci-test-report.py 'out/core-*/ci-tests.xml'
      - name: Profile disposable stripping experiments
        if: always() && steps.macos-build.outcome == 'success'
        run: python tools/native-size-profile.py out/core-Darwin-release/Cliptiq.app/Contents/MacOS/Cliptiq --output out/native-size-oz.json
      - name: Validate unchanged distribution and original size gates
        run: python tools/ci-run.py python packaging/package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: macos-oz-size-experiment-${{ matrix.os }}
          path: |
            out/core-Darwin-release/ci-tests.xml
            out/core-Darwin-release/CMakeCache.txt
            out/core-Darwin-release/compile_commands.json
            out/core-Darwin-release/size-compile-evidence.json
            out/core-Darwin-release/build.ninja
            out/native-size-oz.json
            out/t17-*/size.json
            out/t17-*/package-report.json
  windows-clang:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: MSVC SDK environment with runner LLVM
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -property installationPath
          cmd /c "`"$vsPath\Common7\Tools\VsDevCmd.bat`" -arch=x64 >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$( $matches[1] )=$( $matches[2] )" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          }
      - run: python tools/fetch-footprint-deps.py
      - run: python tools/fetch-lan-deps.py
      - name: Configure isolated Clang size experiment
        shell: pwsh
        run: |
          $llvm = 'C:/Program Files/LLVM/bin'
          & "$llvm/clang-cl.exe" --version
          cmake --preset release "-DCMAKE_C_COMPILER=$llvm/clang-cl.exe" "-DCMAKE_CXX_COMPILER=$llvm/clang-cl.exe" "-DCMAKE_LINKER=$llvm/lld-link.exe" "-DCMAKE_C_FLAGS_MINSIZEREL=/O1 /DNDEBUG /clang:-Oz" "-DCMAKE_CXX_FLAGS_MINSIZEREL=/O1 /DNDEBUG /clang:-Oz"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - id: windows-build
        run: cmake --build --preset release
      - name: Inspect embedded Windows application manifest
        if: always() && steps.windows-build.outcome == 'success'
        run: python tools/inspect-windows-manifest.py out/core-Windows-release/Cliptiq.exe --output out/clang-embedded.manifest
      - run: ctest --preset release --output-on-failure --output-junit ci-tests.xml
      - name: Report all CTest failures
        if: always()
        run: python tools/ci-test-report.py 'out/core-*/ci-tests.xml'
      - name: Validate unchanged distribution and size gates
        if: always() && steps.windows-build.outcome == 'success'
        run: python tools/ci-run.py python packaging/package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-clang-size-experiment
          path: |
            out/clang-embedded.manifest
            out/core-Windows-release/ci-tests.xml
            out/core-Windows-release/CMakeCache.txt
            out/t17-*/size.json
  linux-clang-oz:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Linux backend and isolated-test dependencies
        run: bash tools/install-linux-backend-deps.sh --llvm
      - run: python tools/fetch-footprint-deps.py
      - run: python tools/fetch-lan-deps.py
      - name: Configure isolated Linux Clang size experiment
        run: |
          clang --version
          clang++ --version
          ld.lld --version
          cmake --preset release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            '-DCMAKE_C_FLAGS_MINSIZEREL=-Oz -DNDEBUG' \
            '-DCMAKE_CXX_FLAGS_MINSIZEREL=-Oz -DNDEBUG' \
            -DCMAKE_C_VISIBILITY_PRESET=hidden -DCMAKE_CXX_VISIBILITY_PRESET=hidden \
            -DCMAKE_VISIBILITY_INLINES_HIDDEN=ON \
            -DCMAKE_LINKER_TYPE=LLD \
            '-DCMAKE_EXE_LINKER_FLAGS=-Wl,--as-needed' \
            -DCMAKE_POLICY_DEFAULT_CMP0137=NEW \
            -DCMAKE_TRY_COMPILE_PLATFORM_VARIABLES=CMAKE_LINKER_TYPE \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Record actual Linux optimization and IPO flags
        run: |
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path('out/core-Linux-release')
          commands = json.loads((root / 'compile_commands.json').read_text())
          selected = [row for row in commands if row['file'].endswith(('platform/linux/Menu.cpp', 'platform/MenuHost.cpp', 'platform/linux/Application.cpp', 'core/src/storage.cpp'))]
          (root / 'size-compile-evidence.json').write_text(json.dumps(selected, indent=2) + '\n')
          for row in selected:
              print('::notice title=Compile flags::' + row['command'].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
      - id: linux-build
        run: cmake --build --preset release
      - name: Run full Linux release suite
        run: ctest --preset release --output-on-failure --output-junit ci-tests.xml
      - name: Report all CTest failures
        if: always()
        run: python tools/ci-test-report.py 'out/core-*/ci-tests.xml'
      - name: Record Linux executable-only size
        if: always() && steps.linux-build.outcome == 'success'
        run: |
          python - <<'PY'
          import io, pathlib, zipfile
          data = pathlib.Path('out/core-Linux-release/cliptiq').read_bytes()
          stream = io.BytesIO()
          with zipfile.ZipFile(stream, 'w') as archive:
              info = zipfile.ZipInfo('cliptiq', date_time=(2026, 1, 1, 0, 0, 0))
              info.compress_type = zipfile.ZIP_DEFLATED
              archive.writestr(info, data, compresslevel=9)
          print(f'::notice title=Experimental Linux executable size::bytes={len(data)} zip_bytes={len(stream.getvalue())}; executable only, not distribution validation')
          PY
      - name: Validate unchanged distribution and original size gates
        if: always() && steps.linux-build.outcome == 'success'
        run: python tools/ci-run.py python packaging/package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: linux-clang-oz-size-experiment
          path: |
            out/core-Linux-release/ci-tests.xml
            out/core-Linux-release/Testing/Temporary/LastTest.log
            out/core-Linux-release/CMakeCache.txt
            out/core-Linux-release/compile_commands.json
            out/core-Linux-release/size-compile-evidence.json
            out/core-Linux-release/build.ninja
            out/t17-*/size.json
            out/t17-*/package-report.json
